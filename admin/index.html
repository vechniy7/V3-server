<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Admin</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #292929;
      --border: #323232;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --accent: #ae8b94;
      --ok: #5cb85c;
      --err: #d9534f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 14px; font-size: 1rem; color: var(--accent); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select, button, textarea {
      font: inherit;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #1f1f1f;
      color: var(--text);
      padding: 8px 10px;
    }
    input, select { width: 100%; max-width: 320px; }
    button {
      cursor: pointer;
      background: #3a3a3a;
      border-color: #4a4a4a;
      margin-right: 8px;
      margin-top: 8px;
    }
    button.primary { background: #4a3d42; border-color: var(--accent); }
    button.danger { background: #4a2a2a; border-color: var(--err); }
    button:hover { filter: brightness(1.1); }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 10px; }
    .field { flex: 1; min-width: 140px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .stat { background: #1f1f1f; border-radius: 6px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 1.4rem; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #333; font-size: 0.75rem; }
    .tag.ok { background: #2d4a2d; color: #9fdf9f; }
    .tag.bad { background: #4a2d2d; color: #f0a0a0; }
    .login-box { max-width: 400px; margin: 80px auto; }
    #msg { margin-top: 12px; font-size: 0.9rem; min-height: 1.2em; }
    #msg.ok { color: var(--ok); }
    #msg.err { color: var(--err); }
    .hidden { display: none !important; }
    .mono { font-family: Consolas, monospace; font-size: 0.8rem; word-break: break-all; }
    #genOut { max-height: 160px; overflow: auto; background: #1f1f1f; padding: 10px; border-radius: 5px; margin-top: 10px; }
    .pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
    .pager button { margin-top: 0; }
    .loading { opacity: 0.55; pointer-events: none; }
    #licMeta { font-size: 0.85rem; color: var(--muted); margin: 8px 0 0; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="loginView" class="wrap login-box">
    <div class="card">
      <h1>Nexus Admin</h1>
      <p class="sub">Upstash + Render · введите ADMIN_RESET_TOKEN</p>
      <label>Admin token</label>
      <input type="password" id="tokenIn" placeholder="Bearer token" autocomplete="off" />
      <button class="primary" id="btnLogin">Войти</button>
      <div id="loginMsg"></div>
    </div>
  </div>

  <div id="appView" class="wrap hidden">
    <h1>Nexus Admin</h1>
    <p class="sub">Ключи · лицензии · обновления чита</p>
    <button id="btnLogout">Выйти</button>

    <div class="card">
      <h2>Статистика</h2>
      <div class="stats" id="statsGrid"></div>
      <p id="releaseInfo" class="sub" style="margin-top:12px"></p>
    </div>

    <div class="card">
      <h2>Сгенерировать ключи</h2>
      <div class="row">
        <div class="field">
          <label>Тип</label>
          <select id="genType">
            <option value="trial_2m">2 минуты (тест)</option>
            <option value="month_1">1 месяц</option>
            <option value="month_3">3 месяца</option>
            <option value="lifetime" selected>Навсегда</option>
          </select>
        </div>
        <div class="field">
          <label>Количество</label>
          <input type="number" id="genCount" value="10" min="1" max="500" />
        </div>
        <div class="field">
          <button class="primary" id="btnGen">Создать</button>
        </div>
      </div>
      <div id="genOut" class="mono hidden"></div>
    </div>

    <div class="card">
      <h2>Обновление чита (kernel32.exe)</h2>
      <div class="row">
        <div class="field">
          <label>Версия (например 2.2.0)</label>
          <input type="text" id="relVersion" placeholder="2.2.0" />
        </div>
        <div class="field">
          <label>Файл</label>
          <input type="file" id="relFile" accept=".exe" />
        </div>
      </div>
      <label><input type="checkbox" id="relMandatory" /> Обязательное обновление</label>
      <div>
        <button class="primary" id="btnUpload">Загрузить релиз</button>
        <button class="danger" id="btnDelRelease">Удалить релиз</button>
      </div>
      <p class="sub">Лаунчер при старте сравнивает версию и скачивает файл с сервера.</p>
    </div>

    <div class="card">
      <h2>Ключи</h2>
      <div class="row">
        <div class="field">
          <label>Поиск</label>
          <input type="text" id="searchKey" placeholder="NXS-..." />
        </div>
        <div class="field">
          <label>Фильтр</label>
          <select id="filterStatus">
            <option value="">Все</option>
            <option value="unused">Не использован</option>
            <option value="active">Активен</option>
            <option value="expired">Истёк</option>
            <option value="banned">Забанен</option>
          </select>
        </div>
        <div class="field">
          <label>На странице</label>
          <select id="pageSize">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="field">
          <button id="btnRefresh">Обновить</button>
          <button id="btnRebuildIdx" title="Пересобрать индексы Redis">Индексы</button>
        </div>
      </div>
      <p id="licMeta"></p>
      <div style="overflow-x:auto" id="licTableWrap">
        <table>
          <thead>
            <tr>
              <th>Ключ</th>
              <th>Тип</th>
              <th>Статус</th>
              <th>HWID</th>
              <th>Истекает</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="licBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="btnPrev">← Назад</button>
        <button id="btnNext">Вперёд →</button>
        <span id="pageInfo"></span>
      </div>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    const TOKEN_KEY = 'nexus_admin_token';
    let licPage = 0;
    let licLoading = false;
    let searchTimer = null;

    const api = (path, opts = {}) => {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = { ...(opts.headers || {}), Authorization: 'Bearer ' + token };
      if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      return fetch(path, { ...opts, headers }).then(async (r) => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.message || r.statusText);
        return data;
      });
    };

    const msg = (text, ok) => {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = ok ? 'ok' : 'err';
    };

    const showApp = (on) => {
      document.getElementById('loginView').classList.toggle('hidden', on);
      document.getElementById('appView').classList.toggle('hidden', !on);
      if (on) refreshAll();
    };

    async function refreshStats() {
      const d = await api('/admin/api/stats');
      const g = document.getElementById('statsGrid');
      const s = d.licenses;
      g.innerHTML = `
        <div class="stat"><b>${s.total}</b>Всего</div>
        <div class="stat"><b>${s.unused}</b>Свободно</div>
        <div class="stat"><b>${s.active}</b>Активно</div>
        <div class="stat"><b>${s.expired}</b>Истекло</div>
        <div class="stat"><b>${s.banned}</b>Бан</div>
        <div class="stat"><b>${d.activations}</b>Активаций</div>
      `;
      const ri = document.getElementById('releaseInfo');
      ri.textContent = d.release
        ? `Релиз: v${d.release.version} · ${(d.release.size / 1024 / 1024).toFixed(2)} MB · ${d.release.uploadedAt}`
        : 'Релиз не загружен';
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    async function refreshLicenses(resetPage = false) {
      if (licLoading) return;
      if (resetPage) licPage = 0;

      const search = document.getElementById('searchKey').value.trim().toUpperCase();
      const status = document.getElementById('filterStatus').value;
      const limit = document.getElementById('pageSize').value;

      const q = new URLSearchParams({ limit, page: String(licPage) });
      if (search) q.set('search', search);
      if (status) q.set('status', status);

      const wrap = document.getElementById('licTableWrap');
      const meta = document.getElementById('licMeta');
      licLoading = true;
      wrap.classList.add('loading');
      meta.textContent = 'Загрузка…';

      try {
        const d = await api('/admin/api/licenses?' + q);
        const body = document.getElementById('licBody');
        if (!d.licenses.length) {
          body.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">Нет ключей по этому фильтру</td></tr>';
        } else {
          body.innerHTML = d.licenses.map((l) => {
            let st = l.status;
            if (l.banned) st = 'banned';
            else if (l.expired) st = 'expired';
            const tag = l.banned || l.expired ? 'bad' : (l.status === 'active' ? 'ok' : '');
            const hw = l.hwid ? l.hwid.slice(0, 12) + '…' : '—';
            const exp = l.expiresAt ? new Date(l.expiresAt).toLocaleString() : '∞';
            const k = escapeHtml(l.key);
            return `<tr>
              <td class="mono">${k}</td>
              <td>${escapeHtml(l.typeLabel || l.type)}</td>
              <td><span class="tag ${tag}">${st}</span></td>
              <td class="mono">${hw}</td>
              <td>${exp}</td>
              <td>
                <button data-act="reset" data-key="${k}">Сброс HWID</button>
                <button data-act="ban" data-key="${k}">Бан</button>
                <button data-act="del" data-key="${k}" class="danger">Удалить</button>
              </td>
            </tr>`;
          }).join('');
        }

        const total = d.total || 0;
        const from = total ? d.page * d.limit + 1 : 0;
        const to = Math.min((d.page + 1) * d.limit, total);
        meta.textContent = total
          ? `Показано ${from}–${to} из ${total}`
          : 'Нет данных';
        document.getElementById('pageInfo').textContent = total
          ? `Страница ${d.page + 1} / ${Math.max(1, Math.ceil(total / d.limit))}`
          : '';

        document.getElementById('btnPrev').disabled = d.page <= 0;
        document.getElementById('btnNext').disabled = !d.hasMore;
      } finally {
        licLoading = false;
        wrap.classList.remove('loading');
      }
    }

    async function refreshAll() {
      try {
        await refreshStats();
        await refreshLicenses(true);
        msg('', true);
      } catch (e) {
        msg(e.message, false);
        document.getElementById('licMeta').textContent = '';
      }
    }

    document.getElementById('btnLogin').onclick = () => {
      const t = document.getElementById('tokenIn').value.trim();
      if (!t) return;
      localStorage.setItem(TOKEN_KEY, t);
      api('/admin/api/stats')
        .then(() => showApp(true))
        .catch((e) => {
          localStorage.removeItem(TOKEN_KEY);
          document.getElementById('loginMsg').textContent = e.message;
        });
    };

    document.getElementById('btnLogout').onclick = () => {
      localStorage.removeItem(TOKEN_KEY);
      showApp(false);
    };

    document.getElementById('btnGen').onclick = async () => {
      try {
        const type = document.getElementById('genType').value;
        const count = parseInt(document.getElementById('genCount').value, 10);
        const d = await api('/admin/api/licenses/generate', {
          method: 'POST',
          body: { type, count },
        });
        const out = document.getElementById('genOut');
        out.classList.remove('hidden');
        out.textContent = d.keys.map((k) => k.key).join('\n');
        msg('Создано ключей: ' + d.count, true);
        await refreshStats();
        await refreshLicenses(true);
      } catch (e) {
        msg(e.message, false);
      }
    };

    document.getElementById('btnUpload').onclick = async () => {
      try {
        const file = document.getElementById('relFile').files[0];
        const version = document.getElementById('relVersion').value.trim();
        if (!file || !version) throw new Error('Укажите версию и файл .exe');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        const fileBase64 = btoa(bin);
        msg('Загрузка…', true);
        await api('/admin/api/release/upload', {
          method: 'POST',
          body: {
            version,
            filename: file.name,
            mandatory: document.getElementById('relMandatory').checked,
            fileBase64,
          },
        });
        msg('Релиз v' + version + ' опубликован', true);
        refreshStats();
      } catch (e) {
        msg(e.message, false);
      }
    };

    document.getElementById('btnDelRelease').onclick = async () => {
      if (!confirm('Удалить текущий релиз?')) return;
      try {
        await api('/admin/api/release', { method: 'DELETE' });
        msg('Релиз удалён', true);
        refreshStats();
      } catch (e) {
        msg(e.message, false);
      }
    };

    document.getElementById('btnRefresh').onclick = () => refreshAll();

    document.getElementById('btnPrev').onclick = () => {
      if (licPage > 0) { licPage--; refreshLicenses(); }
    };
    document.getElementById('btnNext').onclick = () => {
      licPage++; refreshLicenses();
    };

    document.getElementById('filterStatus').onchange = () => refreshLicenses(true);
    document.getElementById('pageSize').onchange = () => refreshLicenses(true);
    document.getElementById('searchKey').oninput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => refreshLicenses(true), 350);
    };

    document.getElementById('btnRebuildIdx').onclick = async () => {
      if (!confirm('Пересобрать индексы ключей? (1–2 мин на 4000 ключей)')) return;
      try {
        msg('Пересборка индексов…', true);
        const d = await api('/admin/api/licenses/rebuild-index', { method: 'POST' });
        msg('Индексы обновлены: ' + (d.indexed || 0) + ' ключей', true);
        refreshAll();
      } catch (e) {
        msg(e.message, false);
      }
    };

    document.getElementById('licBody').onclick = async (ev) => {
      const btn = ev.target.closest('button[data-act]');
      if (!btn) return;
      const key = btn.dataset.key;
      const act = btn.dataset.act;
      try {
        if (act === 'reset') {
          await api('/admin/reset', { method: 'POST', body: { key } });
          msg('HWID сброшен', true);
        } else if (act === 'ban') {
          await api('/admin/api/licenses/ban', { method: 'POST', body: { key } });
          msg('Ключ забанен', true);
        } else if (act === 'del') {
          if (!confirm('Удалить ключ ' + key + '?')) return;
          await api('/admin/api/licenses', { method: 'DELETE', body: { key } });
          msg('Удалено', true);
        }
        await refreshStats();
        await refreshLicenses(false);
      } catch (e) {
        msg(e.message, false);
      }
    };

    if (localStorage.getItem(TOKEN_KEY)) {
      api('/admin/api/stats').then(() => showApp(true)).catch(() => localStorage.removeItem(TOKEN_KEY));
    }
  </script>
</body>
</html>
